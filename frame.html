<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bread sign-in sheet check: frame</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: .5rem; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  p { margin: 0 0 .3rem; }
  ol { margin: 0; padding-left: 1.2rem; }
  li { overflow-wrap: anywhere; }
</style>
</head>
<body>
<p>This frame tries to open Bread's sign-in sheet and reports what happened to the page that embeds it.</p>
<ol id="steps"></ol>

<script>
(() => {
  'use strict';

  const steps = document.getElementById('steps');
  const framed = window.top !== window;

  function report(text, tone) {
    const item = document.createElement('li');
    item.textContent = text;
    steps.append(item);
    if (framed) window.parent.postMessage({ kind: 'bread-sign-in-check-frame', text, tone: tone || '' }, '*');
  }

  function messageOf(error) {
    return error !== null && typeof error === 'object' ? String(error.message) : String(error);
  }

  function bridgeRefused(code) {
    report(`Bread's bridge refused with ${code}`, code === 'AUTH_NOT_MAIN_FRAME' ? 'ok' : 'bad');
  }

  if (!framed) {
    report('This page only runs its checks inside a frame. Open the main page and use its iframe buttons.');
    return;
  }

  const url = new URL('auth.html', location.href).href;
  report(`frame on ${location.origin}`);

  const bread = window.bread;
  if (bread === undefined) report('window.bread: absent in the frame', 'ok');
  else report(`window.bread: present in the frame (${typeof bread}), which a frame isn't expected to have`);

  const auth = bread && bread.auth;
  if (auth && typeof auth.open === 'function') {
    report('window.bread.auth: present in the frame; calling open');
    let result;
    try {
      result = Promise.resolve(auth.open(url));
    } catch (error) {
      result = Promise.reject(error);
    }
    result.then(
      value => report(`window.bread.auth.open resolved ${JSON.stringify(value)}, but a frame must be refused`, 'bad'),
      error => {
        const code = messageOf(error);
        report(`window.bread.auth.open rejected with ${code}`, code === 'AUTH_NOT_MAIN_FRAME' ? 'ok' : 'bad');
      },
    );
  } else {
    report('window.bread.auth: absent in the frame, so the page API offers nothing to call', 'ok');
  }

  const webkit = window.webkit;
  const ios = webkit && webkit.messageHandlers && webkit.messageHandlers.breadAuth;
  const android = ios ? undefined : window.breadAuth;
  let answered = false;

  if (ios && typeof ios.postMessage === 'function') {
    report("Bread's iOS bridge is visible in the frame; posting to it directly");
    let reply;
    try {
      reply = Promise.resolve(ios.postMessage({ url }));
    } catch (error) {
      reply = Promise.reject(error);
    }
    reply.then(
      value => {
        answered = true;
        report(`Bread's bridge replied ${JSON.stringify(value)}, but a frame must be refused`, 'bad');
      },
      error => {
        answered = true;
        bridgeRefused(messageOf(error));
      },
    );
  } else if (android && typeof android.postMessage === 'function') {
    report("Bread's Android bridge is visible in the frame; posting to it directly");
    const id = `frame_${Array.from(crypto.getRandomValues(new Uint8Array(6)), byte => byte.toString(16).padStart(2, '0')).join('')}`;
    const onReply = event => {
      let data;
      try {
        data = JSON.parse(event.data);
      } catch (error) {
        return;
      }
      if (!data || data.id !== id) return;
      answered = true;
      if (typeof data.error === 'string') bridgeRefused(data.error);
      else report(`Bread's bridge replied ${event.data}, but a frame must be refused`, 'bad');
    };
    if (typeof android.addEventListener === 'function') android.addEventListener('message', onReply);
    else android.onmessage = onReply;
    try {
      android.postMessage(JSON.stringify({ id, url }));
    } catch (error) {
      answered = true;
      report(`posting to Bread's bridge threw ${messageOf(error)}`, 'bad');
    }
  } else {
    answered = true;
    report("Bread's sign-in bridge: not visible in the frame, so there is nothing to call directly", 'ok');
  }

  setTimeout(() => {
    if (!answered) report("no reply from Bread's bridge after 10 s; if a sheet opened, the frame was not refused");
  }, 10000);
})();
</script>
</body>
</html>
